name: render

on:
  push:
    branches: [main]
    paths: ["data/**", "pipeline/**", "schema/**"]
  pull_request:
    paths: ["data/**", "pipeline/**", "schema/**"]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python pipeline/render.py
      # Pushes made with GITHUB_TOKEN do not trigger this workflow again.
      - name: Commit regenerated files
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add README.md events data
          git diff --cached --quiet || { git commit -m "Re-render README and indexes"; git push; }
